<!doctype html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />

    <!--
      القيم التي تبدأ وتنتهي بـ __ (مثل __SITE_TITLE__) تُملأ تلقائيًا
      من ملف src/content/site.ts عند التشغيل والبناء. انظر vite.config.ts
    -->
    <title>__SITE_TITLE__</title>
    <meta name="description" content="__SITE_DESCRIPTION__" />
    <meta name="robots" content="__SITE_ROBOTS__" />
    <link rel="canonical" href="__SITE_URL__/" />

    <!-- Open Graph: شكل الرابط عند مشاركته في واتساب وتويتر وغيرها -->
    <meta property="og:type" content="website" />
    <meta property="og:locale" content="ar_SA" />
    <meta property="og:locale:alternate" content="en_US" />
    <meta property="og:site_name" content="__SITE_NAME__" />
    <meta property="og:title" content="__SITE_TITLE__" />
    <meta property="og:description" content="__SITE_DESCRIPTION__" />
    <meta property="og:url" content="__SITE_URL__/" />
    <meta property="og:image" content="__SITE_URL__/og-image.jpg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="__SITE_OG_ALT__" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="__SITE_TITLE__" />
    <meta name="twitter:description" content="__SITE_DESCRIPTION__" />
    <meta name="twitter:image" content="__SITE_URL__/og-image.jpg" />

    <!-- لون شريط المتصفح في الجوال (نفس لون الخلفية في theme.css) -->
    <meta name="theme-color" content="#f8f1ec" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#1b1310" media="(prefers-color-scheme: dark)" />
    <meta name="color-scheme" content="light dark" />

    <!-- صورة الصفحة الرئيسية تُحمَّل مبكرًا لأنها أكبر عنصر يظهر أولًا -->
    <link rel="preload" as="image" href="/face.webp" type="image/webp" fetchpriority="high" />

    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />

    <!-- الخطوط من Google Fonts: الاتصال المبكر يسرّع تحميلها -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500&family=IBM+Plex+Sans+Arabic:wght@400;500;600&family=Manrope:wght@400..700&family=Reem+Kufi:wght@400..700&display=swap"
    />

    <!--
      يطبّق اللغة المحفوظة قبل ظهور الصفحة، حتى لا يومض الاتجاه الخاطئ.
      مفتاح الحفظ 'lumaa-lang' مكرر في src/i18n/LanguageContext.ts
    -->
    <script>
      try {
        if (localStorage.getItem('lumaa-lang') === 'en') {
          document.documentElement.lang = 'en'
          document.documentElement.dir = 'ltr'
        }
        // الوضع الفاتح/الداكن المثبّت يدويًا (مفتاح 'lumaa-theme' مكرر في src/theme/ThemeContext.ts)
        var theme = localStorage.getItem('lumaa-theme')
        if (theme === 'light' || theme === 'dark') document.documentElement.dataset.theme = theme
      } catch (error) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <noscript>يحتاج هذا الموقع إلى تفعيل JavaScript. This site needs JavaScript enabled.</noscript>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
